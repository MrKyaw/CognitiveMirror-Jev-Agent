[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-mirror-jev-mcp"
version = "1.0.0"
description = "MCP server providing cognitive mirroring, Jev context intelligence, decision framing, business impact and guardrails for personal and enterprise agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.6",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "typesafe-sdk>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.4"]

[project.scripts]
cognitive-mirror-mcp = "cognitive_mirror.mcp_server:main"
cognitive-mirror-api = "cognitive_mirror.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cognitive_mirror = ["ui.html", "config/*.json", "config/policies/*.json", "schemas/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not perf and not container'"
markers = [
  "e2e: PRD workflow and MCP discovery tests (run with -m e2e)",
  "perf: latency/concurrency tests against PRD NFR targets (run with -m perf)",
  "property: Hypothesis property-based tests",
  "eval: evaluation harness against labeled datasets (PRD success metrics)",
  "container: tests against the running Docker container (run with -m container)",
  "req(*ids): PRD requirement(s) a test verifies, e.g. MCP-001 or COG-004",
]
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
  "ignore::DeprecationWarning:uvicorn.*",
]

[tool.coverage.run]
source = ["cognitive_mirror"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py310"
