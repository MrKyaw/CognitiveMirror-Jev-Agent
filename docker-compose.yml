services:
  # Single service: REST API + MCP (stdio) + UIs.
  # UI-1 Demo Console + UI-2 Approval Inbox are served by the API itself:
  #   http://127.0.0.1:8000/ui  (root / redirects there)
  app:
    build: .
    image: cognitive-mirror-jev-mcp:local
    ports:
      - "${PORT:-8000}:8000"
    environment:
      CM_DEPLOYMENT_MODE: ${CM_DEPLOYMENT_MODE:-local}
      CM_DB_PATH: data/cognitive_mirror.db
      CM_DATABASE_URL: ${CM_DATABASE_URL:-}
      CM_API_KEYS: ${CM_API_KEYS:-dev-agent-key:agent,dev-admin-key:admin,dev-compliance-key:compliance}
      CM_REQUIRE_AUTH: "true"
      CM_POLICY_PROFILE: ${CM_POLICY_PROFILE:-default}
    volumes:
      - cm-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional PostgreSQL backend (PRD Phase 2 readiness):
  #   docker compose --profile postgres up -d --build --wait
  #   CM_DATABASE_URL=postgresql://cm:cm@db:5432/cm docker compose --profile postgres up
  db:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: cm
      POSTGRES_PASSWORD: cm
      POSTGRES_DB: cm
    volumes:
      - cm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cm-data:
  cm-pgdata:
