name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m pytest -q --cov --cov-fail-under=100
      - run: PYTHONPATH=src python -m pytest -q -m "e2e or perf or postgres"
        env:
          CM_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/cm_test
      - run: python -m ruff check src tests tools
      - run: PYTHONPATH=src python -m cognitive_mirror.schemas --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: docker compose up -d --build --wait
      - run: bash tools/compose_smoke.sh
      - run: PYTHONPATH=src python -m pytest -q -m container
      - run: docker compose down -v
